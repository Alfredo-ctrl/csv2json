[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csv2json"
version = "0.1.0"
description = "Convert CSV and JSON tables both ways, built for AI agents. CLI, Python API and MCP server."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Alfredo Ramos"}]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
csv2json = "csv2json.cli:main"

[tool.setuptools.packages.find]
include = ["csv2json*"]
