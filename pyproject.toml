[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csv2json"
version = "0.1.0"
description = "Convert CSV and JSON tables both ways. Plain stdlib, no dependencies."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Alfredo Ramos"}]
requires-python = ">=3.10"
keywords = ["csv", "json", "cli", "mcp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Alfredo-ctrl/csv2json"
Repository = "https://github.com/Alfredo-ctrl/csv2json"

[project.scripts]
csv2json = "csv2json.cli:main"

[tool.setuptools.packages.find]
include = ["csv2json*"]
